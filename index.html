<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Hosted AI Chatbot | Powered by AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chat-container {
            width: 95%;
            max-width: 1300px;
            height: 90vh;
            background: white;
            border-radius: 25px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .bot-avatar {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .header-info h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .header-info p {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .status-badge {
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            margin-bottom: 5px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 20px;
            border-radius: 20px;
            word-wrap: break-word;
            line-height: 1.5;
            position: relative;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .bot .message-content {
            background: white;
            color: #1f2937;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .message-time {
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.6;
        }

        .user .message-time {
            text-align: right;
            color: #667eea;
        }

        .bot .message-time {
            color: #6b7280;
        }

        /* Input Area */
        .chat-input-area {
            padding: 20px 25px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .send-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .send-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 12px 20px;
            background: white;
            border-radius: 20px;
            width: fit-content;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        /* Quick Actions */
        .quick-actions {
            padding: 15px 25px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quick-btn {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            color: #4b5563;
        }

        .quick-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-1px);
        }

        /* Settings Panel */
        .settings-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: none;
            z-index: 1000;
            min-width: 250px;
        }

        .settings-panel.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .settings-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }

        /* Scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #c7d2fe;
            border-radius: 10px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .message-content {
                max-width: 85%;
            }
            .chat-header {
                padding: 15px 20px;
            }
            .quick-actions {
                display: none;
            }
            .send-button {
                padding: 12px 20px;
            }
        }

        /* Code blocks */
        .message-content pre {
            background: #1f2937;
            color: #e5e7eb;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .message-content code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="bot-avatar">🤖</div>
            <div class="header-info">
                <h1>AI Smart Assistant</h1>
                <p>Powered by Advanced AI | Self-Hosted</p>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>Online</span>
            </div>
            <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div>
                    <div class="message-content">
                        👋 Hello! I'm your AI assistant.<br><br>
                        I can help you with:<br>
                        • Answering questions<br>
                        • Writing code<br>
                        • Creative tasks<br>
                        • Problem solving<br><br>
                        What would you like help with today?
                    </div>
                    <div class="message-time">Just now</div>
                </div>
            </div>
        </div>
        
        <div class="quick-actions">
            <button class="quick-btn" onclick="sendQuickMessage('Write a Python function to reverse a string')">📝 Write Python code</button>
            <button class="quick-btn" onclick="sendQuickMessage('Explain quantum computing simply')">🔬 Explain science</button>
            <button class="quick-btn" onclick="sendQuickMessage('Give me 5 startup ideas')">💡 Startup ideas</button>
            <button class="quick-btn" onclick="sendQuickMessage('Write a poem about technology')">📖 Write a poem</button>
            <button class="quick-btn" onclick="sendQuickMessage('Help me debug this code')">🐛 Debug code</button>
        </div>
        
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="userInput" placeholder="Type your message here..." onkeypress="handleKeyPress(event)">
            <button class="send-button" id="sendBtn" onclick="sendMessage()">Send 📤</button>
        </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <h3 style="margin-bottom: 10px;">Settings</h3>
        <label style="display: block; margin-bottom: 10px;">
            <input type="checkbox" id="darkMode" onchange="toggleDarkMode()"> Dark Mode
        </label>
        <label style="display: block; margin-bottom: 10px;">
            <input type="checkbox" id="soundEnabled" checked> Sound Effects
        </label>
        <button onclick="clearChat()" style="width: 100%; padding: 8px; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer;">Clear Chat</button>
        <button onclick="exportChat()" style="width: 100%; padding: 8px; margin-top: 10px; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer;">Export Chat</button>
    </div>

    <script>
        // FREE AI API - No key needed! This uses a public AI endpoint
        // Note: For production, replace with your own API endpoint
        
        let conversationHistory = [];
        let isTyping = false;
        
        // Load saved messages from localStorage
        function loadChatHistory() {
            const saved = localStorage.getItem('chat_history');
            if (saved) {
                try {
                    const messages = JSON.parse(saved);
                    const messagesDiv = document.getElementById('chatMessages');
                    messagesDiv.innerHTML = '';
                    messages.forEach(msg => {
                        addMessageToUI(msg.text, msg.type, msg.time);
                    });
                } catch(e) {}
            }
        }
        
        // Save messages to localStorage
        function saveChatHistory() {
            const messages = [];
            document.querySelectorAll('.message').forEach(msg => {
                const type = msg.classList.contains('user') ? 'user' : 'bot';
                const text = msg.querySelector('.message-content').innerText;
                const time = msg.querySelector('.message-time')?.innerText || '';
                messages.push({ text, type, time });
            });
            localStorage.setItem('chat_history', JSON.stringify(messages.slice(-50))); // Keep last 50
        }
        
        function addMessageToUI(text, type, time = null) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const timeString = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.innerHTML = `
                <div>
                    <div class="message-content">${formatMessage(text)}</div>
                    <div class="message-time">${timeString}</div>
                </div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            saveChatHistory();
            
            // Play sound if enabled
            if (document.getElementById('soundEnabled')?.checked && type === 'bot') {
                playSound();
            }
        }
        
        function formatMessage(text) {
            // Format code blocks
            text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                return `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
            });
            
            // Format inline code
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Format line breaks
            text = text.replace(/\n/g, '<br>');
            
            return text;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function addUserMessage(text) {
            addMessageToUI(text, 'user');
            conversationHistory.push({ role: 'user', content: text });
        }
        
        function addBotMessage(text) {
            addMessageToUI(text, 'bot');
            conversationHistory.push({ role: 'assistant', content: text });
            
            // Keep conversation history reasonable
            if (conversationHistory.length > 20) {
                conversationHistory = conversationHistory.slice(-20);
            }
        }
        
        function showTypingIndicator() {
            if (isTyping) return;
            isTyping = true;
            
            const messagesDiv = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div>
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
            isTyping = false;
        }
        
        function playSound() {
            // Simple beep sound using Web Audio API
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 880;
                gainNode.gain.value = 0.1;
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.3);
                oscillator.stop(audioContext.currentTime + 0.3);
                audioContext.resume();
            } catch(e) {}
        }
        
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message || isTyping) return;
            
            input.value = '';
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;
            
            addUserMessage(message);
            showTypingIndicator();
            
            try {
                // Using a free AI API endpoint (no key required)
                // This calls a public AI service - for production, replace with your own
                const response = await fetch('https://api.ryzendesu.com/v1/ai/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        prompt: message,
                        model: 'gpt-3.5-turbo'
                    })
                });
                
                let aiResponse;
                
                if (response.ok) {
                    const data = await response.json();
                    aiResponse = data.response || data.message || data.result || "I received your message but couldn't generate a response.";
                } else {
                    // Fallback: Smart offline responses
                    aiResponse = getSmartFallbackResponse(message);
                }
                
                removeTypingIndicator();
                addBotMessage(aiResponse);
                
            } catch (error) {
                console.error('Error:', error);
                removeTypingIndicator();
                // Smart offline fallback
                const fallbackResponse = getSmartFallbackResponse(message);
                addBotMessage(fallbackResponse + "\n\n💡 *Note: Using offline mode. For full AI capabilities, ensure you have an internet connection.*");
            } finally {
                input.disabled = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }
        
        // Smart fallback responses when API is unavailable
        function getSmartFallbackResponse(message) {
            const lowerMsg = message.toLowerCase();
            
            if (lowerMsg.includes('hello') || lowerMsg.includes('hi') || lowerMsg.includes('hey')) {
                return "Hello! 👋 How can I assist you today?";
            }
            if (lowerMsg.includes('how are you')) {
                return "I'm doing great, thanks for asking! Ready to help you with anything you need. 😊";
            }
            if (lowerMsg.includes('python') && lowerMsg.includes('code')) {
                return "Here's a useful Python function:\n\n```python\ndef reverse_string(s):\n    return s[::-1]\n\n# Example usage\nprint(reverse_string(\"Hello World!\"))\n```\n\nThis reverses any string you pass to it!";
            }
            if (lowerMsg.includes('javascript') && lowerMsg.includes('code')) {
                return "Here's a JavaScript example:\n\n```javascript\nconst reverseString = (str) => str.split('').reverse().join('');\nconsole.log(reverseString('Hello')); // Output: 'olleH'\n```";
            }
            if (lowerMsg.includes('weather')) {
                return "I can't check real-time weather without an internet connection. Please enable internet access for current weather data! ☀️";
            }
            if (lowerMsg.includes('thank')) {
                return "You're very welcome! 🎉 I'm happy to help. Feel free to ask me anything else!";
            }
            if (lowerMsg.includes('joke')) {
                const jokes = [
                    "Why don't scientists trust atoms? Because they make up everything! 😂",
                    "What do you call a fake noodle? An impasta! 🍝",
                    "Why did the scarecrow win an award? He was outstanding in his field! 🌾"
                ];
                return jokes[Math.floor(Math.random() * jokes.length)];
            }
            if (lowerMsg.includes('love')) {
                return "Love is a beautiful thing! ❤️ Is there something specific about love you'd like to discuss?";
            }
            if (lowerMsg.includes('help')) {
                return "I can help you with:\n• Answering questions\n• Writing code in Python, JavaScript, etc.\n• Creative writing\n• Problem solving\n• General advice\n\nJust ask me anything!";
            }
            
            // Default intelligent response
            return `Thanks for your message! Here's my response:\n\n"I understand you're asking about "${message.substring(0, 50)}${message.length > 50 ? '...' : ''}". \n\nTo give you the best answer, could you provide more details? I'm here to help with coding, questions, creative tasks, and more! 🚀\n\n*Tip: Make sure you have an internet connection for full AI capabilities.*`;
        }
        
        function sendQuickMessage(message) {
            document.getElementById('userInput').value = message;
            sendMessage();
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        function clearChat() {
            if (confirm('Clear all messages?')) {
                const messagesDiv = document.getElementById('chatMessages');
                messagesDiv.innerHTML = '';
                conversationHistory = [];
                addBotMessage("Chat cleared! How can I help you? 😊");
            }
        }
        
        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('show');
        }
        
        function toggleDarkMode() {
            if (document.getElementById('darkMode').checked) {
                document.body.style.background = '#1a1a2e';
                document.querySelector('.chat-container').style.background = '#16213e';
                document.querySelector('.chat-messages').style.background = '#0f3460';
                document.querySelectorAll('.bot .message-content').forEach(el => {
                    el.style.background = '#1a1a2e';
                    el.style.color = '#e2e8f0';
                });
            } else {
                document.body.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                document.querySelector('.chat-container').style.background = 'white';
                document.querySelector('.chat-messages').style.background = '#f8f9fa';
                document.querySelectorAll('.bot .message-content').forEach(el => {
                    el.style.background = 'white';
                    el.style.color = '#1f2937';
                });
            }
        }
        
        function exportChat() {
            let chatText = "AI Chatbot Conversation Export\n";
            chatText += "=".repeat(50) + "\n\n";
            
            document.querySelectorAll('.message').forEach(msg => {
                const type = msg.classList.contains('user') ? 'User' : 'AI Assistant';
                const text = msg.querySelector('.message-content').innerText;
                const time = msg.querySelector('.message-time')?.innerText || '';
                chatText += `[${type}] ${time}\n${text}\n${"-".repeat(30)}\n`;
            });
            
            const blob = new Blob([chatText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat_export_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Load chat history on start
        loadChatHistory();
        
        // Auto-focus input
        document.getElementById('userInput').focus();
        
        // Close settings when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.settings-panel') && !e.target.closest('.settings-btn')) {
                document.getElementById('settingsPanel').classList.remove('show');
            }
        });
    </script>
</body>
  </html>
